<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnica Mindfulness 5-4-3-2-1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card-container">
        <div class="header">
            <span class="badge">Técnica de Mindfulness 5-4-3-2-1</span>
            <h1 id="titulo">Ejercicio Guiado</h1>
        </div>

        <div class="breath-circle-container">
            <div class="breath-circle" id="breath-circle">
                <!-- SVG del temporizador circular -->
                <svg class="timer-svg" viewBox="0 0 100 100">
                    <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                    <circle id="timer-progress" class="timer-progress" cx="50" cy="50" r="45"></circle>
                </svg>

                <!-- Contenedor central -->
                <div id="icon-container" class="icon-container">
                    <div class="relax-waves">
                        <div class="wave-ring"></div>
                        <div class="wave-ring"></div>
                        <div class="wave-ring"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-text">
            <p id="descripcion" class="descripcion">Presiona el botón de abajo para comenzar tu práctica de atención plena.</p>
            <div id="sub-indicacion" class="sub-indicacion"></div>
        </div>

        <div class="controls-nav">
            <button id="btn-siguiente" class="btn-nav btn-primary">Iniciar Ejercicio</button>
            <button id="btn-pausa" class="btn-nav btn-pause">⏸ Pausar</button>
            <button id="btn-anterior" class="btn-nav btn-pause" disabled>← Anterior</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
