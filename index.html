<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexión Presente 5-4-3-2-1</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f4f7f5 0%, #e8efe9 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #6b8e85;
      --primary-dark: #4a6b63;
      --text-main: #2c3e35;
      --text-muted: #5f7367;
      --card-shadow: 0 12px 32px rgba(107, 142, 133, 0.12);
      --border-color: rgba(107, 142, 133, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 35px 25px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--card-shadow);
      text-align: center;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.5rem;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .display-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 25px 20px;
      min-height: 400px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
    }

    .step-title {
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .step-text {
      font-size: 1.1rem;
      line-height: 1.5;
      color: var(--text-main);
      margin: 10px 0;
    }

    .media-viewport {
      width: 100%;
      height: 190px;
      margin: 10px 0;
      border-radius: 16px;
      overflow: hidden;
      background: #f0f4f1;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(107, 142, 133, 0.15);
    }

    .media-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.4s ease;
    }

    .object-hint {
      font-size: 0.9rem;
      color: var(--primary-dark);
      background: #f0f5f3;
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      text-align: left;
      display: none;
    }

    .status-badge {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-dark);
      background: #e8f0ec;
      border: 1px solid var(--border-color);
      padding: 6px 18px;
      border-radius: 20px;
    }

    .controls { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .nav-group { display: flex; gap: 10px; width: 100%; }

    button {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    button:disabled { background: #dce4e1; color: #9aa8a1; cursor: not-allowed; }
    
    .btn-main { width: 100%; padding: 14px; font-size: 1rem; }
    .btn-nav { flex: 1; background: #e8f0ec; color: var(--primary-dark); }
    .btn-sec { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Conexión Presente</h1>

    <div class="display-card">
      <div id="step-title" class="step-title">Preparación</div>
      
      <div class="media-viewport">
        <img id="step-image" src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=600&q=80" alt="Meditación">
      </div>

      <div id="step-text" class="step-text">Adopta una postura cómoda, respira profundo y presiona Iniciar.</div>
      <div id="object-hint" class="object-hint"></div>
      <div id="status-badge" class="status-badge">Listo</div>
    </div>

    <!-- AUDIO DE PIANO REAL INSTRUMENTAL EN BUCLE -->
    <audio id="piano-bg" loop preload="auto">
      <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=relaxing-piano-112299.mp3" type="audio/mpeg">
    </audio>

    <div class="controls">
      <div class="nav-group">
        <button id="prev-btn" class="btn-nav" onclick="navigateStep(-1)" disabled>◄ Anterior</button>
        <button id="next-btn" class="btn-nav" onclick="navigateStep(1)" disabled>Siguiente ►</button>
      </div>

      <button id="start-btn" class="btn-main" onclick="start()">Iniciar Experiencia</button>
      <button id="reset-btn" class="btn-sec" onclick="reset()" disabled>Reiniciar</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const pianoAudio = document.getElementById('piano-bg');

    const modules = [
      { 
        cat: "5. Vista", 
        text: "Observa a tu alrededor y nombra cinco objetos mentalmente.", 
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Una lámpara, tu reloj, una planta, una ventana, una silla." 
      },
      { 
        cat: "4. Tacto", 
        text: "Conecta con la textura y temperatura de cuatro objetos a tu alcance.", 
        image: "https://images.unsplash.com/photo-1516541196182-6bdb0516ed27?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Tu ropa, la mesa de madera, tus manos, una superficie fría." 
      },
      { 
        cat: "3. Oído", 
        text: "Cierra los ojos y escucha la resonancia profunda del cuenco.", 
        image: "https://images.unsplash.com/photo-1512438248247-f0f2a5a8b7f0?auto=format&fit=crop&w=600&q=80",
        isBowlStep: true,
        hint: "Permite que la frecuencia limpie cualquier distracción sonora." 
      },
      { 
        cat: "2. Olfato", 
        text: "Huele dos aromas de tu entorno y percibe el aire al inhalar.", 
        image: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Tu café, una flor, aceite esencial o el aire fresco." 
      },
      { 
        cat: "1. Gusto", 
        text: "Experimenta la sensación y sabor presente en tu boca.", 
        image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Un sorbo de agua, una fruta o la frescura del paladar." 
      }
    ];

    let currentIdx = 0;

    // MANEJO DE MÚSICA DE FONDO (PIANO SUAVE Y RELAJANTE)
    function playPianoBG(volume = 0.25) {
      pianoAudio.volume = volume;
      pianoAudio.play().catch(e => console.log("Interacción requerida para audio"));
    }

    function lowerPianoBG() {
      pianoAudio.volume = 0.05; // Baja suavemente para dar espacio a la voz
    }

    function stopPianoBG() {
      pianoAudio.pause();
    }

    // VOZ NATIVA DEL NAVEGADOR
    function speakText(text, callback) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'es-ES';
        utterance.rate = 0.85; // Tono pausado

        lowerPianoBG();

        utterance.onend = () => {
          playPianoBG(0.25);
          if (callback) callback();
        };

        window.speechSynthesis.speak(utterance);
      } else if (callback) {
        callback();
      }
    }

    // CUENCO TIBETANO POTENTE Y DE EXTENSIÓN LARGA (12s)
    function playLongSingingBowl() {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      stopPianoBG(); // Silencia el piano durante la vibración del cuenco

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(432, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.85, audioCtx.currentTime + 0.3);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 11.9);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 12.0);

      setTimeout(() => {
        playPianoBG(0.25); // Reanuda el piano al finalizar el cuenco
      }, 12000);
    }

    function start() {
      currentIdx = 0;
      document.getElementById('start-btn').disabled = true;
      document.getElementById('reset-btn').disabled = false;
      document.getElementById('prev-btn').disabled = false;
      document.getElementById('next-btn').disabled = false;
      
      playPianoBG(0.25);
      renderStep();
    }

    function renderStep() {
      const mod = modules[currentIdx];
      document.getElementById('step-title').textContent = mod.cat;
      document.getElementById('step-text').textContent = mod.text;
      document.getElementById('step-image').src = mod.image;

      const hintEl = document.getElementById('object-hint');
      if (mod.hint) {
        hintEl.textContent = mod.hint;
        hintEl.style.display = "block";
      } else {
        hintEl.style.display = "none";
      }

      document.getElementById('status-badge').textContent = "Escuchando instrucción...";
      
      speakText(mod.text, () => {
        if (mod.isBowlStep) {
          document.getElementById('status-badge').textContent = "Escuchando Cuenco (12s)...";
          playLongSingingBowl();
        } else {
          document.getElementById('status-badge').textContent = "En curso";
        }
      });
    }

    function navigateStep(dir) {
      window.speechSynthesis.cancel();
      currentIdx += dir;
      if (currentIdx < 0) currentIdx = 0;
      if (currentIdx >= modules.length) currentIdx = modules.length - 1;
      renderStep();
    }

    function reset() {
      window.speechSynthesis.cancel();
      stopPianoBG();
      location.reload();
    }
  </script>
</body>
</html>
