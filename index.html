<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio de Grounding 5-4-3-2-1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 id="stage-title">Cargando experiencia...</h1>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </header>

        <main class="stage-viewer">
            <div id="visual-content" class="visual-content">
                <svg id="olfato-animation" viewBox="0 0 300 400" class="hidden">
                    <path d="M 100,100 Q 140,120 150,160 Q 140,200 150,260 L 120,320 M 150,260 L 180,320" stroke="#b2bec3" stroke-width="4" fill="none"/>
                    <circle class="aroma-particle p1" cx="120" cy="180" r="6" fill="#a29bfe"/>
                    <circle class="aroma-particle p2" cx="120" cy="180" r="5" fill="#74b9ff"/>
                </svg>
                <img id="stage-image" src="" alt="Ilustración del sentido" class="stage-img">
            </div>
            <p id="stage-subtext" class="stage-subtext"></p>
        </main>

        <footer class="controls-container">
            <button id="btn-prev" class="btn">⏮ Anterior</button>
            <button id="btn-play-pause" class="btn btn-primary">▶ Iniciar</button>
            <button id="btn-next" class="btn">Siguiente ⏭</button>
        </footer>
    </div>

    <audio id="bg-music" src="assets/audio/ambiental.mp3" loop></audio>
    <audio id="main-audio"></audio>

    <script src="script.js"></script>
</body>
</html>
