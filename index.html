<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexión Presente 5-4-3-2-1</title>
  <style>
    :root {
      --bg: #f3eff9;
      --card: #ffffff;
      --primary: #7c5cbf;
      --accent: #e8e1f5;
      --text: #2d2b32;
      --error: #d9534f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card);
      border-radius: 20px;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      text-align: center;
    }

    h1 { color: var(--primary); font-size: 1.4rem; margin-bottom: 15px; }

    .display-card {
      background: var(--accent);
      border-radius: 16px;
      padding: 25px 20px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      position: relative;
    }

    .step-title { font-weight: 700; color: var(--primary); font-size: 1rem; text-transform: uppercase; margin-bottom: 12px; }
    .step-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 15px; }
    .status-badge { font-size: 0.9rem; font-weight: 600; color: var(--primary); background: #ffffff; padding: 6px 14px; border-radius: 20px; }
    .error-msg { color: var(--error); font-weight: 600; margin-top: 10px; font-size: 0.85rem; }

    /* Animación del recorrido del aroma (Fase Olfato) */
    .aroma-container {
      display: none;
      width: 140px;
      height: 140px;
      margin: 10px auto;
    }

    .aroma-active .aroma-container {
      display: block;
    }

    .aroma-path {
      fill: none;
      stroke: #a88be8;
      stroke-width: 4;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
    }

    .aroma-active .aroma-path {
      animation: flowAroma 4s linear infinite;
    }

    @keyframes flowAroma {
      0% { stroke-dashoffset: 200; opacity: 0.2; }
      50% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -200; opacity: 0.2; }
    }

    .controls { display: flex; gap: 10px; justify-content: center; }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { background: #ccc; cursor: not-allowed; }
    .btn-sec { background: #e0e0e0; color: #333; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Conexión Presente 5-4-3-2-1</h1>

    <div class="display-card" id="card">
      <div id="step-title" class="step-title">Preparación</div>
      <div id="step-text" class="step-text">Ponte en una posición cómoda y presiona Iniciar.</div>

      <!-- ANIMACIÓN SVG: Recorrido del aroma -->
      <div class="aroma-container">
        <svg viewBox="0 0 100 100" width="100%" height="100%">
          <path d="M 30,55 C 30,45 35,25 50,25 C 65,25 70,45 70,55" fill="none" stroke="#d2c5ed" stroke-width="2" stroke-dasharray="2 2" />
          <path d="M 50,55 L 50,70 M 50,70 L 40,85 M 50,70 L 60,85" fill="none" stroke="#d2c5ed" stroke-width="2" stroke-dasharray="2 2" />
          <path class="aroma-path" d="M 32,60 C 35,50 40,30 50,30 C 60,30 50,50 50,65 C 50,75 38,85 38,85 M 50,65 C 50,75 62,85 62,85" />
          <circle cx="32" cy="60" r="3" fill="#a88be8" />
          <circle cx="50" cy="30" r="3" fill="#a88be8" />
          <circle cx="38" cy="85" r="4" fill="#a88be8" />
          <circle cx="62" cy="85" r="4" fill="#a88be8" />
        </svg>
      </div>

      <div id="status-badge" class="status-badge">Listo</div>
      <div id="error-display" class="error-msg"></div>
    </div>

    <div class="controls">
      <button id="start-btn" onclick="start()">Iniciar</button>
      <button id="reset-btn" class="btn-sec" onclick="reset()" disabled>Reiniciar</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Generador sintetizado de sonidos relajantes de 9 segundos
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'bowl') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(432, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 8.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 8.8);
      } else if (type === 'waves') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(100, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 8.5);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 4.5);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 8.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 8.8);
      } else if (type === 'whale') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(420, audioCtx.currentTime + 4.5);
        osc.frequency.linearRampToValueAtTime(180, audioCtx.currentTime + 8.8);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 8.8);
        osc.start();
        osc.stop(audioCtx.currentTime + 8.8);
      }
    }

    // Mapeo exacto ajustado al nombre de tu archivo: audio_05_sabor.mp3
    const modules = [
      { cat: "5. Vista", text: "Observa a tu alrededor y nombra 5 objetos mentalmente.", file: "audio_01_vista.mp3" },
      { cat: "4. Tacto", text: "Conecta con la textura y temperatura de 4 objetos a tu alcance.", file: "audio_02_tacto.mp3" },
      { 
        cat: "3. Oído", 
        text: "Cierra los ojos y escucha atentamente.", 
        file: "audio_03_oido.mp3",
        hasAmbientSounds: true 
      },
      { cat: "2. Olfato", text: "Huele 2 objetos y visualiza el recorrido del aroma.", file: "audio_04_olfato.mp3", anim: true },
      { cat: "1. Gusto", text: "Experimenta las sensaciones del alimento en tu boca.", file: "audio_05_sabor.mp3" },
      { cat: "Cierre", text: "Mueve suavemente tus manos y tus hombros. Tu atención ha vuelto por completo al aquí y al ahora.", file: "audio_06_cierre.mp3" }
    ];

    let currentModuleIdx = 0;
    let currentAudio = null;
    let ambientTimeout1 = null;
    let ambientTimeout2 = null;

    function start() {
      currentModuleIdx = 0;
      document.getElementById('error-display').textContent = "";
      document.getElementById('start-btn').disabled = true;
      document.getElementById('reset-btn').disabled = false;
      runModule();
    }

    function runModule() {
      if (currentModuleIdx >= modules.length) {
        finish();
        return;
      }

      const mod = modules[currentModuleIdx];
      document.getElementById('step-title').textContent = mod.cat;
      document.getElementById('step-text').textContent = mod.text;
      document.getElementById('status-badge').textContent = "Escuchando...";
      document.getElementById('error-display').textContent = "";

      const card = document.getElementById('card');
      if (mod.anim) {
        card.classList.add('aroma-active');
      } else {
        card.classList.remove('aroma-active');
      }

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      const audioPath = `audio/${mod.file}`;
      currentAudio = new Audio(audioPath);

      currentAudio.onerror = () => {
        document.getElementById('status-badge').textContent = "Error de audio";
        document.getElementById('error-display').textContent = `No se encontró el archivo: ${audioPath}`;
      };

      currentAudio.play().catch(err => {
        console.error("Error al reproducir:", err);
        document.getElementById('error-display').textContent = "Haz clic en la pantalla para permitir la reproducción.";
      });

      currentAudio.onended = () => {
        if (mod.hasAmbientSounds) {
          playAmbientSequence();
        } else {
          currentModuleIdx++;
          runModule();
        }
      };
    }

    function playAmbientSequence() {
      const sounds = [
        { type: 'bowl', text: "Cuenco tibetano..." },
        { type: 'waves', text: "Olas del mar..." },
        { type: 'whale', text: "Canto de ballenas..." }
      ];

      let soundIdx = 0;

      function triggerNextSound() {
        if (soundIdx >= sounds.length) {
          currentModuleIdx++;
          runModule();
          return;
        }

        const snd = sounds[soundIdx];
        document.getElementById('step-text').textContent = snd.text;
        document.getElementById('status-badge').textContent = "Sonido relajante";
        
        playSound(snd.type);

        ambientTimeout1 = setTimeout(() => {
          document.getElementById('status-badge').textContent = "Pausa...";
          ambientTimeout2 = setTimeout(() => {
            soundIdx++;
            triggerNextSound();
          }, 2000);
        }, 9000);
      }

      triggerNextSound();
    }

    function finish() {
      document.getElementById('card').classList.remove('aroma-active');
      document.getElementById('step-title').textContent = "Completado";
      document.getElementById('step-text').textContent = "Has vuelto al aquí y al ahora.";
      document.getElementById('status-badge').textContent = "✓ Finalizado";
      document.getElementById('start-btn').disabled = false;
      document.getElementById('reset-btn').disabled = true;
    }

    function reset() {
      clearTimeout(ambientTimeout1);
      clearTimeout(ambientTimeout2);
      
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      document.getElementById('card').classList.remove('aroma-active');
      document.getElementById('step-title').textContent = "Preparación";
      document.getElementById('step-text').textContent = "Ponte en una posición cómoda y presiona Iniciar.";
      document.getElementById('status-badge').textContent = "Listo";
      document.getElementById('error-display').textContent = "";
      document.getElementById('start-btn').disabled = false;
      document.getElementById('reset-btn').disabled = true;
    }
  </script>
</body>
</html>
