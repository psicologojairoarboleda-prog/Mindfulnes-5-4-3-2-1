<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Técnica Mindfulness 5-4-3-2-1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <main class="card-container">
        <header class="header">
            <span class="badge">Ejercicio Guiado</span>
            <h1 id="titulo">Técnica Mindfulness 5-4-3-2-1</h1>
        </header>

        <section class="content-body">
            <div class="breath-circle-container">
                <div class="breath-circle">
                    <svg class="timer-svg" viewBox="0 0 100 100">
                        <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
                        <circle class="timer-progress" id="timer-progress" cx="50" cy="50" r="45"></circle>
                    </svg>
                    <span id="timer-display" class="timer-text">--</span>
                </div>
            </div>

            <p id="descripcion" class="descripcion">
                Bienvenido a este espacio de calma. Haz clic en el botón para iniciar la técnica de conexión con el presente.
            </p>
            <p id="sub-indicacion" class="sub-indicacion"></p>
        </section>

        <footer class="controls-nav">
            <button id="btn-anterior" class="btn-nav" title="Anterior" disabled>← Anterior</button>
            <button id="btn-pausa" class="btn-nav btn-pause" title="Pausar / Reanudar">⏸ Pausar</button>
            <button id="btn-siguiente" class="btn-nav btn-primary" title="Siguiente">Iniciar Ejercicio</button>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
