<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexión Presente 5-4-3-2-1</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f7f9f8 0%, #eef2f5 100%);
      --card-bg: rgba(255, 255, 255, 0.92);
      --primary: #6b8e85;      /* Verde salvia relajante */
      --primary-dark: #4a6b63;
      --accent: #8e7cc3;        /* Lavanda suave */
      --text-main: #2c3e35;
      --text-muted: #5f7367;
      --card-shadow: 0 10px 30px rgba(107, 142, 133, 0.12);
      --border-color: rgba(107, 142, 133, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 35px 25px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--card-shadow);
      text-align: center;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.5rem;
      letter-spacing: 1.5px;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .display-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 25px 20px;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.02);
    }

    .step-title {
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .step-text {
      font-size: 1.1rem;
      line-height: 1.5;
      color: var(--text-main);
      margin: 10px 0;
    }

    /* VISOR VISUAL Y MULTIMEDIA */
    .media-viewport {
      width: 100%;
      height: 180px;
      margin: 10px 0;
      border-radius: 16px;
      overflow: hidden;
      background: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(107, 142, 133, 0.15);
    }

    .media-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.5s ease-in-out;
    }

    .object-hint {
      font-size: 0.9rem;
      color: var(--primary-dark);
      background: #f0f5f3;
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      text-align: left;
      display: none;
    }

    .status-badge {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-dark);
      background: #e8f0ec;
      border: 1px solid var(--border-color);
      padding: 6px 18px;
      border-radius: 20px;
    }

    /* CONTROLES */
    .controls { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
    .nav-group { display: flex; gap: 10px; width: 100%; }

    button {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    button:disabled { background: #dce4e1; color: #9aa8a1; cursor: not-allowed; }
    
    .btn-main { width: 100%; padding: 14px; font-size: 1rem; }
    .btn-nav { flex: 1; background: #e8f0ec; color: var(--primary-dark); }
    .btn-sec { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Conexión Presente</h1>

    <div class="display-card">
      <div id="step-title" class="step-title">Preparación</div>
      
      <!-- CONTENEDOR VISUAL DE IMÁGENES -->
      <div class="media-viewport">
        <img id="step-image" src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=600&q=80" alt="Meditación y Calma">
      </div>

      <div id="step-text" class="step-text">Adopta una postura cómoda, respira profundo y presiona Iniciar.</div>
      <div id="object-hint" class="object-hint"></div>
      <div id="status-badge" class="status-badge">Listo</div>
    </div>

    <div class="controls">
      <div class="nav-group">
        <button id="prev-btn" class="btn-nav" onclick="navigateStep(-1)" disabled>◄ Anterior</button>
        <button id="pause-btn" class="btn-nav" onclick="togglePause()" disabled>❚❚ Pausa</button>
        <button id="next-btn" class="btn-nav" onclick="navigateStep(1)" disabled>Siguiente ►</button>
      </div>

      <button id="start-btn" class="btn-main" onclick="start()">Iniciar Experiencia</button>
      <button id="reset-btn" class="btn-sec" onclick="reset()" disabled>Reiniciar</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let bgMusicGain = null;
    let bgOscs = [];

    // MÚSICA DE FONDO: PIANO INSTRUMENTAL SUAVE
    function startAmbientPiano() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (bgMusicGain) return;

      bgMusicGain = audioCtx.createGain();
      bgMusicGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      bgMusicGain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 2);
      bgMusicGain.connect(audioCtx.destination);

      // Acordes de piano constantes e instrumentales suaves (Frecuencias armónicas)
      const pianoNotes = [261.63, 329.63, 392.00, 523.25]; // Do mayor amplio
      bgOscs = pianoNotes.map(freq => {
        const osc = audioCtx.createOscillator();
        osc.type = 'triangle'; // Tono cálido de instrumento
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        const oscGain = audioCtx.createGain();
        oscGain.gain.value = 0.2;
        osc.connect(oscGain);
        oscGain.connect(bgMusicGain);
        osc.start();
        return osc;
      });
    }

    function pauseAmbientMusic() {
      if (bgMusicGain) bgMusicGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
    }

    function resumeAmbientMusic() {
      if (bgMusicGain) bgMusicGain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.5);
      else startAmbientPiano();
    }

    // REPRODUCCIÓN DEL CUENCO TIBETANO ALTO Y LARGO (12 SEGUNDOS)
    function playLongSingingBowl() {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(432, audioCtx.currentTime); // Frecuencia armónica 432 Hz

      // Volumen alto y decaimiento extendido
      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.8, audioCtx.currentTime + 0.3); // Ataque fuerte y claro
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 11.9); // Resonancia larga de 12s

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      
      osc.start();
      osc.stop(audioCtx.currentTime + 12.0);
    }

    // ESTRUCTURA CON IMÁGENES TEMÁTICAS ASOCIADAS
    const modules = [
      { 
        cat: "5. Vista", 
        text: "Observa a tu alrededor y nombra 5 objetos mentalmente.", 
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Una lámpara, tu reloj, una planta, una ventana, una silla." 
      },
      { 
        cat: "4. Tacto", 
        text: "Conecta con la textura y temperatura de 4 objetos a tu alcance.", 
        image: "https://images.unsplash.com/photo-1516541196182-6bdb0516ed27?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Tu ropa, la mesa de madera, tus manos, una superficie fría." 
      },
      { 
        cat: "3. Oído", 
        text: "Cierra los ojos y escucha la resonancia profunda del cuenco.", 
        image: "https://images.unsplash.com/photo-1512438248247-f0f2a5a8b7f0?auto=format&fit=crop&w=600&q=80",
        isBowlStep: true,
        hint: "Permite que la frecuencia limpie cualquier distracción sonora." 
      },
      { 
        cat: "2. Olfato", 
        text: "Huele 2 aromas de tu entorno y percibe el aire al inhalar.", 
        image: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Tu café, una flor, aceite esencial o el aire fresco." 
      },
      { 
        cat: "1. Gusto", 
        text: "Experimenta la sensación y sabor presente en tu boca.", 
        image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Un sorbo de agua, una fruta o la frescura del paladar." 
      }
    ];

    let currentIdx = 0;

    function start() {
      currentIdx = 0;
      document.getElementById('start-btn').disabled = true;
      document.getElementById('reset-btn').disabled = false;
      document.getElementById('prev-btn').disabled = false;
      document.getElementById('next-btn').disabled = false;
      startAmbientPiano();
      renderStep();
    }

    function renderStep() {
      const mod = modules[currentIdx];
      document.getElementById('step-title').textContent = mod.cat;
      document.getElementById('step-text').textContent = mod.text;
      document.getElementById('step-image').src = mod.image;

      const hintEl = document.getElementById('object-hint');
      if (mod.hint) {
        hintEl.textContent = mod.hint;
        hintEl.style.display = "block";
      } else {
        hintEl.style.display = "none";
      }

      if (mod.isBowlStep) {
        pauseAmbientMusic();
        document.getElementById('status-badge').textContent = "Escuchando Cuenco (12s)...";
        playLongSingingBowl();
        setTimeout(() => { resumeAmbientMusic(); }, 12000);
      } else {
        resumeAmbientMusic();
        document.getElementById('status-badge').textContent = "En curso";
      }
    }

    function navigateStep(dir) {
      currentIdx += dir;
      if (currentIdx < 0) currentIdx = 0;
      if (currentIdx >= modules.length) currentIdx = modules.length - 1;
      renderStep();
    }

    function reset() {
      location.reload();
    }
  </script>
</body>
</html>
