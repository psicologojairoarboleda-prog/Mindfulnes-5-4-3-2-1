<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio de Grounding 5-4-3-2-1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="app-card">
        <header class="app-header">
            <span class="step-badge" id="step-badge">Paso 1 de 7</span>
            <h1 id="stage-title">Cargando...</h1>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar"></div>
            </div>
        </header>

        <section class="stage-viewer">
            <div id="visual-content" class="visual-wrapper"></div>
            <p id="stage-subtext" class="stage-subtext"></p>
        </section>

        <footer class="controls-wrapper">
            <button id="btn-prev" class="btn btn-secondary" aria-label="Anterior">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <button id="btn-play-pause" class="btn btn-primary">
                <span id="btn-icon">▶</span>
                <span id="btn-text">Iniciar</span>
            </button>
            <button id="btn-next" class="btn btn-secondary" aria-label="Siguiente">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </footer>
    </main>

    <!-- Pista de fondo constante y reproductor principal -->
    <audio id="bg-music" loop preload="auto">
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=meditation-piano-112270.mp3" type="audio/mpeg">
    </audio>
    <audio id="main-audio" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
