<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexión Presente 5-4-3-2-1</title>
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #f3f7f4 0%, #e5eee8 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --primary: #5b8276;
      --primary-dark: #3f5e54;
      --text-main: #24332c;
      --text-muted: #586e63;
      --card-shadow: 0 16px 40px rgba(91, 130, 118, 0.15);
      --border-color: rgba(91, 130, 118, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 32px;
      padding: 40px 28px;
      max-width: 540px;
      width: 100%;
      box-shadow: var(--card-shadow);
      text-align: center;
    }

    h1 {
      color: var(--primary-dark);
      font-size: 1.6rem;
      letter-spacing: 1.8px;
      margin-bottom: 22px;
      font-weight: 600;
    }

    .display-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 25px 20px;
      min-height: 440px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }

    .step-title {
      font-weight: 700;
      color: var(--primary-dark);
      font-size: 1.25rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .step-text {
      font-size: 1.1rem;
      line-height: 1.5;
      color: var(--text-main);
      margin: 12px 0;
    }

    .media-viewport {
      width: 100%;
      height: 180px;
      margin: 10px 0;
      border-radius: 18px;
      overflow: hidden;
      background: #eef4f0;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid rgba(91, 130, 118, 0.15);
    }

    .media-viewport img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .object-hint {
      font-size: 0.9rem;
      color: var(--primary-dark);
      background: #eef5f1;
      border-left: 4px solid var(--primary);
      padding: 10px 14px;
      border-radius: 8px;
      width: 100%;
      text-align: left;
      display: none;
    }

    .timer-display {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary-dark);
      margin: 5px 0;
      display: none;
    }

    .status-badge {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary-dark);
      background: #e4eee7;
      border: 1px solid var(--border-color);
      padding: 6px 18px;
      border-radius: 20px;
    }

    .controls { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
    .nav-group { display: flex; gap: 10px; width: 100%; }

    button {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 13px 20px;
      border-radius: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    button:disabled { background: #d3dfd9; color: #8fa39a; cursor: not-allowed; }
    
    .btn-main { width: 100%; padding: 15px; font-size: 1rem; }
    .btn-nav { flex: 1; background: #e4eee7; color: var(--primary-dark); }
    .btn-sec { background: transparent; color: var(--text-muted); border: 1px solid var(--border-color); }
    .btn-pause { background: #d07d32; }
    .btn-pause:hover:not(:disabled) { background: #b06522; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Conexión Presente 5-4-3-2-1</h1>

    <div class="display-card">
      <div id="step-title" class="step-title">Preparación</div>
      
      <div class="media-viewport">
        <img id="step-image" src="https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=600&q=80" alt="Meditación y Calma">
      </div>

      <div id="step-text" class="step-text">Adopta una postura cómoda, respira profundo y presiona Iniciar.</div>
      <div id="object-hint" class="object-hint"></div>
      <div id="timer-display" class="timer-display">00s</div>
      <div id="status-badge" class="status-badge">Listo</div>
    </div>

    <audio id="piano-bg" loop preload="auto"><source src="audio/musica_fondo_piano.mp3" type="audio/mpeg"></audio>
    
    <audio id="v-0" preload="auto"><source src="audio/audio_01_vista.mp3" type="audio/mpeg"></audio>
    <audio id="v-1" preload="auto"><source src="audio/audio_02_tacto.mp3" type="audio/mpeg"></audio>
    <audio id="v-2" preload="auto"><source src="audio/audio_03_oido.mp3" type="audio/mpeg"></audio>
    <audio id="v-3" preload="auto"><source src="audio/audio_04_olfato.mp3" type="audio/mpeg"></audio>
    <audio id="v-4" preload="auto"><source src="audio/audio_05_sabor.mp3" type="audio/mpeg"></audio>

    <audio id="e-0" preload="auto"><source src="audio/efecto_riachuelo.mp3" type="audio/mpeg"></audio>
    <audio id="e-1" preload="auto"><source src="audio/efecto_viento.mp3" type="audio/mpeg"></audio>
    <audio id="e-2" preload="auto"><source src="audio/efecto_aves.mp3" type="audio/mpeg"></audio>

    <div class="controls">
      <div class="nav-group">
        <button id="prev-btn" class="btn-nav" onclick="navigateStep(-1)" disabled>◄ Anterior</button>
        <button id="next-btn" class="btn-nav" onclick="navigateStep(1)" disabled>Siguiente ►</button>
      </div>

      <div class="nav-group">
        <button id="start-btn" class="btn-main" onclick="startExperience()">Iniciar Experiencia</button>
        <button id="pause-btn" class="btn-pause" onclick="togglePause()" disabled>Pausar</button>
      </div>

      <button id="reset-btn" class="btn-sec" onclick="resetExperience()" disabled>Reiniciar</button>
    </div>
  </div>

  <script>
    const pianoAudio = document.getElementById('piano-bg');
    let isPaused = false;
    let currentIdx = 0;
    let activeVoice = null;
    let activeEffect = null;
    let countdownInterval = null;
    let remainingSeconds = 0;

    const VOL_PIANO_NORMAL = 0.15;
    const VOL_PIANO_DUCKING = 0.02;

    const modules = [
      { 
        cat: "5. Vista", 
        text: "Observa a tu alrededor y nombra 5 objetos mentalmente.", 
        voiceId: "v-0",
        effectId: "e-0",
        extraSeconds: 6,
        image: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Una lámpara, tu reloj, una planta, una ventana, una silla." 
      },
      { 
        cat: "4. Tacto", 
        text: "Conecta con la textura y temperatura de 4 objetos a tu alcance.", 
        voiceId: "v-1",
        effectId: "e-1",
        extraSeconds: 10,
        image: "https://images.unsplash.com/photo-1516541196182-6bdb0516ed27?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Tu ropa, la mesa de madera, tus manos, una superficie fría." 
      },
      { 
        cat: "3. Oído", 
        text: "Cierra los ojos y escucha el sonido de las aves al amanecer.", 
        voiceId: "v-2",
        effectId: "e-2",
        extraSeconds: 0, // 0s extra porque el audio ambiental dura 10s
        image: "https://images.unsplash.com/photo-1512438248247-f0f2a5a8b7f0?auto=format&fit=crop&w=600&q=80",
        hint: "Permite que la frecuencia natural limpie cualquier distracción." 
      },
      { 
        cat: "2. Olfato", 
        text: "Huele 2 aromas de tu entorno y percibe el aire al inhalar.", 
        voiceId: "v-3",
        effectId: null,
        extraSeconds: 6,
        image: "https://images.unsplash.com/photo-1544367567-0f2fcb009e0b?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Tu café, una flor, aceite esencial o el aire fresco." 
      },
      { 
        cat: "1. Gusto", 
        text: "Experimenta la sensación y sabor presente en tu boca.", 
        voiceId: "v-4",
        effectId: null,
        extraSeconds: 6,
        image: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80",
        hint: "Ejemplo: Un sorbo de agua, una fruta o la frescura del paladar." 
      }
    ];

    function stopAllTimersAndAudios() {
      if (countdownInterval) {
        clearInterval(countdownInterval);
        countdownInterval = null;
      }
      document.getElementById('timer-display').style.display = "none";

      if (activeVoice) {
        activeVoice.pause();
        activeVoice.currentTime = 0;
        activeVoice.onended = null;
        activeVoice = null;
      }
      if (activeEffect) {
        activeEffect.pause();
        activeEffect.currentTime = 0;
        activeEffect.onended = null;
        activeEffect = null;
      }
    }

    function startExperience() {
      currentIdx = 0;
      isPaused = false;
      document.getElementById('start-btn').disabled = true;
      document.getElementById('pause-btn').disabled = false;
      document.getElementById('reset-btn').disabled = false;
      document.getElementById('prev-btn').disabled = false;
      document.getElementById('next-btn').disabled = false;
      
      pianoAudio.volume = VOL_PIANO_NORMAL;
      pianoAudio.play().catch(() => {});

      renderStep();
    }

    function renderStep() {
      stopAllTimersAndAudios();
      if (isPaused) return;

      const mod = modules[currentIdx];
      document.getElementById('step-title').textContent = mod.cat;
      document.getElementById('step-text').textContent = mod.text;
      document.getElementById('step-image').src = mod.image;

      const hintEl = document.getElementById('object-hint');
      if (mod.hint) {
        hintEl.textContent = mod.hint;
        hintEl.style.display = "block";
      } else {
        hintEl.style.display = "none";
      }

      document.getElementById('status-badge').textContent = "Escuchando instrucción...";
      pianoAudio.volume = VOL_PIANO_DUCKING;

      activeVoice = document.getElementById(mod.voiceId);
      if (activeVoice) {
        activeVoice.currentTime = 0;
        activeVoice.play().catch(e => console.log("Error voz:", e));

        activeVoice.onended = () => {
          if (mod.effectId) {
            document.getElementById('status-badge').textContent = "Sonido ambiental activo...";
            activeEffect = document.getElementById(mod.effectId);
            if (activeEffect) {
              activeEffect.currentTime = 0;
              activeEffect.play().catch(e => console.log("Error efecto:", e));

              activeEffect.onended = () => {
                pianoAudio.volume = VOL_PIANO_NORMAL;
                startExtraTimer(mod.extraSeconds);
              };
            }
          } else {
            pianoAudio.volume = VOL_PIANO_NORMAL;
            startExtraTimer(mod.extraSeconds);
          }
        };
      }
    }

    function startExtraTimer(seconds) {
      if (seconds <= 0) {
        document.getElementById('status-badge').textContent = "Paso listo. Presiona Siguiente";
        return;
      }

      remainingSeconds = seconds;
      const timerEl = document.getElementById('timer-display');
      timerEl.style.display = "block";
      timerEl.textContent = `${remainingSeconds}s`;
      document.getElementById('status-badge').textContent = "Tiempo para realizar el ejercicio...";

      countdownInterval = setInterval(() => {
        if (!isPaused) {
          remainingSeconds--;
          timerEl.textContent = `${remainingSeconds}s`;

          if (remainingSeconds <= 0) {
            clearInterval(countdownInterval);
            countdownInterval = null;
            timerEl.style.display = "none";
            document.getElementById('status-badge').textContent = "Paso listo. Presiona Siguiente";
          }
        }
      }, 1000);
    }

    function togglePause() {
      const pauseBtn = document.getElementById('pause-btn');

      if (!isPaused) {
        isPaused = true;
        pauseBtn.textContent = "Reanudar";
        document.getElementById('status-badge').textContent = "En Pausa";

        if (activeVoice) activeVoice.pause();
        if (activeEffect) activeEffect.pause();
        pianoAudio.pause();
      } else {
        isPaused = false;
        pauseBtn.textContent = "Pausar";

        pianoAudio.play().catch(() => {});

        if (activeVoice && !activeVoice.ended && activeVoice.currentTime > 0) {
          pianoAudio.volume = VOL_PIANO_DUCKING;
          activeVoice.play();
          document.getElementById('status-badge').textContent = "Escuchando instrucción...";
        } else if (activeEffect && !activeEffect.ended && activeEffect.currentTime > 0) {
          pianoAudio.volume = VOL_PIANO_DUCKING;
          activeEffect.play();
          document.getElementById('status-badge').textContent = "Sonido ambiental activo...";
        } else if (remainingSeconds > 0) {
          pianoAudio.volume = VOL_PIANO_NORMAL;
          document.getElementById('status-badge').textContent = "Tiempo para realizar el ejercicio...";
        } else {
          pianoAudio.volume = VOL_PIANO_NORMAL;
          document.getElementById('status-badge').textContent = "Paso listo. Presiona Siguiente";
        }
      }
    }

    function navigateStep(dir) {
      stopAllTimersAndAudios();
      if (isPaused) {
        isPaused = false;
        document.getElementById('pause-btn').textContent = "Pausar";
      }

      currentIdx += dir;
      if (currentIdx < 0) currentIdx = 0;
      if (currentIdx >= modules.length) currentIdx = modules.length - 1;

      renderStep();
    }

    function resetExperience() {
      stopAllTimersAndAudios();
      pianoAudio.pause();
      location.reload();
    }
  </script>
</body>
</html>
