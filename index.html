<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexión Presente 5-4-3-2-1</title>
  <style>
    :root {
      --bg-dark: #0f0a1c;
      --card-bg: rgba(26, 18, 48, 0.75);
      --primary: #b38add;
      --accent-glow: #d4a5ff;
      --text-light: #ece7f6;
      --gold: #dfb260;
      --error: #ff5c5c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

    body {
      background: radial-gradient(circle at center, #1e1238 0%, var(--bg-dark) 100%);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(179, 138, 221, 0.2);
      border-radius: 24px;
      padding: 35px 25px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 40px rgba(124, 92, 191, 0.25);
      text-align: center;
      position: relative;
    }

    h1 {
      color: var(--primary);
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(179, 138, 221, 0.5);
    }

    .display-card {
      background: rgba(15, 10, 28, 0.6);
      border: 1px solid rgba(223, 178, 96, 0.15);
      border-radius: 20px;
      padding: 25px 20px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
    }

    .step-title {
      font-weight: 700;
      color: var(--gold);
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .step-text {
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 20px;
      color: #dcd3ee;
      z-index: 2;
    }

    .status-badge {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--accent-glow);
      background: rgba(179, 138, 221, 0.12);
      border: 1px solid rgba(179, 138, 221, 0.3);
      padding: 6px 16px;
      border-radius: 20px;
      z-index: 2;
    }

    .error-msg { color: var(--error); font-weight: 600; margin-top: 10px; font-size: 0.85rem; }

    /* CONTENEDOR DE ANIMACIONES MÍSTICAS */
    .anim-viewport {
      width: 140px;
      height: 140px;
      margin: 10px auto;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .anim-layer {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
    }

    .active-anim { display: flex; justify-content: center; align-items: center; }

    /* Visual 1: Pulsos místico (Vista / Tacto / Gusto / Cierre) */
    .mystic-pulse {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(179,138,221,0.8) 0%, rgba(223,178,96,0.2) 70%, transparent 100%);
      animation: pulseGlow 3s infinite ease-in-out;
      box-shadow: 0 0 25px var(--primary);
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.8); opacity: 0.5; box-shadow: 0 0 15px var(--primary); }
      50% { transform: scale(1.2); opacity: 0.9; box-shadow: 0 0 35px var(--gold); }
    }

    /* Visual 2: Ondas Sonoras Espirales (Oído) */
    .sound-waves {
      width: 100px;
      height: 100px;
      border: 2px solid var(--primary);
      border-radius: 50%;
      animation: waveExpand 2s infinite linear;
      position: absolute;
    }

    .sound-waves:nth-child(2) { animation-delay: 0.6s; }
    .sound-waves:nth-child(3) { animation-delay: 1.2s; }

    @keyframes waveExpand {
      0% { width: 20px; height: 20px; opacity: 1; border-color: var(--gold); }
      100% { width: 120px; height: 120px; opacity: 0; border-color: var(--primary); }
    }

    /* Visual 3: Diagrama Anatómico de Inhalación de Aroma (Olfato) */
    .olfato-svg {
      width: 120px;
      height: 120px;
    }

    .aroma-particle {
      fill: var(--gold);
      animation: flowNasal 2.5s infinite ease-in-out;
    }

    @keyframes flowNasal {
      0% { transform: translateY(20px) scale(0.5); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-40px) scale(1.2); opacity: 0; }
    }

    .controls { display: flex; gap: 12px; justify-content: center; }
    button {
      background: linear-gradient(135deg, #7c5cbf 0%, #5a3d93 100%);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 14px 28px;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.3s ease;
    }
    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 92, 191, 0.5);
    }
    button:disabled { background: #2a223d; color: #665c7a; border-color: transparent; cursor: not-allowed; }
    .btn-sec { background: rgba(255,255,255,0.08); color: var(--text-light); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Conexión Presente</h1>

    <div class="display-card" id="card">
      <div id="step-title" class="step-title">Preparación</div>
      <div id="step-text" class="step-text">Adopta una postura cómoda, respira profundo y presiona Iniciar.</div>

      <!-- VIEWPORT DE ANIMACIONES INTERACTIVAS -->
      <div class="anim-viewport">
        <!-- Visual Genérico: Pulso místico -->
        <div id="anim-pulse" class="anim-layer active-anim">
          <div class="mystic-pulse"></div>
        </div>

        <!-- Visual Oído: Ondas Expansivas -->
        <div id="anim-sound" class="anim-layer">
          <div class="sound-waves"></div>
          <div class="sound-waves"></div>
          <div class="sound-waves"></div>
        </div>

        <!-- Visual Olfato: Inhalación Anatómica SVG -->
        <div id="anim-olfato" class="anim-layer">
          <svg class="olfato-svg" viewBox="0 0 100 100">
            <!-- Silueta estilizada de rostro e inhalación -->
            <path d="M 35,80 Q 30,55 45,45 T 50,20" fill="none" stroke="rgba(179,138,221,0.4)" stroke-width="3" stroke-linecap="round"/>
            <path d="M 45,45 Q 60,40 55,60 T 40,80" fill="none" stroke="rgba(223,178,96,0.3)" stroke-width="2" stroke-dasharray="3 3"/>
            <!-- Partículas de aroma ascendente -->
            <circle class="aroma-particle" cx="45" cy="70" r="4" style="animation-delay: 0s;"/>
            <circle class="aroma-particle" cx="42" cy="60" r="3" style="animation-delay: 0.6s;"/>
            <circle class="aroma-particle" cx="48" cy="50" r="3.5" style="animation-delay: 1.2s;"/>
          </svg>
        </div>
      </div>

      <div id="status-badge" class="status-badge">Listo</div>
      <div id="error-display" class="error-msg"></div>
    </div>

    <div class="controls">
      <button id="start-btn" onclick="start()">Iniciar</button>
      <button id="reset-btn" class="btn-sec" onclick="reset()" disabled>Reiniciar</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let droneGain = null;
    let droneOsc1 = null;
    let droneOsc2 = null;

    // 1. ZUMBIDO MÍSTICO CONTINUO DE FONDO (Frecuencias 108Hz y 108.5Hz - Battement Alfa)
    function startAmbientDrone() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (droneGain) return;

      droneGain = audioCtx.createGain();
      droneGain.gain.setValueAtTime(0.04, audioCtx.currentTime); // Volumen suave subyacente
      droneGain.connect(audioCtx.destination);

      droneOsc1 = audioCtx.createOscillator();
      droneOsc2 = audioCtx.createOscillator();

      droneOsc1.type = 'sine';
      droneOsc2.type = 'sine';

      droneOsc1.frequency.setValueAtTime(108, audioCtx.currentTime);
      droneOsc2.frequency.setValueAtTime(108.5, audioCtx.currentTime);

      droneOsc1.connect(droneGain);
      droneOsc2.connect(droneGain);

      droneOsc1.start();
      droneOsc2.start();
    }

    function stopAmbientDrone() {
      if (droneGain) {
        droneGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
        setTimeout(() => {
          if (droneOsc1) { droneOsc1.stop(); droneOsc1.disconnect(); }
          if (droneOsc2) { droneOsc2.stop(); droneOsc2.disconnect(); }
          droneGain = null;
        }, 1000);
      }
    }

    // 2. SINTETIZADOR MÍSTICO DE 8 SEGUNDOS EXACTOS (SIN PITOS)
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (type === 'bowl') {
        // Cuenco Tibetano Armónico (432Hz con resonancia pura)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(432, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 7.9);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 8.0);

      } else if (type === 'wind') {
        // Viento Místico Relleno (Ruido Rosa Filtrado - Sin Pitos)
        const bufferSize = audioCtx.sampleRate * 8;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          let white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
          data[i] *= 0.05;
          b6 = white * 0.115926;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(250, audioCtx.currentTime);
        filter.frequency.linearRampToValueAtTime(450, audioCtx.currentTime + 4);
        filter.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 8);
        filter.Q.value = 1.2;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 3);
        gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 7.9);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
        noise.stop(audioCtx.currentTime + 8.0);

      } else if (type === 'whale') {
        // Canto de Ballenas Subacuático Profundo (Sin frecuencias agudas estridentes)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(260, audioCtx.currentTime + 3.5);
        osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 7.8);

        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.25, audioCtx.currentTime + 2);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 7.9);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 8.0);
      }
    }

    // ESTRUCTURA CON PAUSA EXACTA DE 7 SEGUNDOS Y VISUALES ESPECÍFICOS
    const modules = [
      { cat: "5. Vista", text: "Observa a tu alrededor y nombra 5 objetos mentalmente.", file: "audio_01_vista.mp3", pauseTime: 7, animType: "pulse" },
      { cat: "4. Tacto", text: "Conecta con la textura y temperatura de 4 objetos a tu alcance.", file: "audio_02_tacto.mp3", pauseTime: 7, animType: "pulse" },
      { 
        cat: "3. Oído", 
        text: "Cierra los ojos y escucha atentamente.", 
        file: "audio_03_oido.mp3",
        hasAmbientSounds: true,
        animType: "sound"
      },
      { cat: "2. Olfato", text: "Huele 2 objetos y visualiza el recorrido del aroma.", file: "audio_04_olfato.mp3", pauseTime: 7, animType: "olfato" },
      { cat: "1. Gusto", text: "Experimenta las sensaciones del alimento en tu boca.", file: "audio_05_sabor.mp3", pauseTime: 7, animType: "pulse" },
      { cat: "Cierre", text: "Mueve suavemente tus manos y tus hombros. Tu atención ha vuelto por completo al aquí y al ahora.", file: "audio_06_cierre.mp3", pauseTime: 0, animType: "pulse" }
    ];

    let currentModuleIdx = 0;
    let currentAudio = null;
    let actionTimeout = null;

    function setAnimation(type) {
      document.getElementById('anim-pulse').classList.remove('active-anim');
      document.getElementById('anim-sound').classList.remove('active-anim');
      document.getElementById('anim-olfato').classList.remove('active-anim');

      if (type === 'sound') document.getElementById('anim-sound').classList.add('active-anim');
      else if (type === 'olfato') document.getElementById('anim-olfato').classList.add('active-anim');
      else document.getElementById('anim-pulse').classList.add('active-anim');
    }

    function start() {
      currentModuleIdx = 0;
      document.getElementById('error-display').textContent = "";
      document.getElementById('start-btn').disabled = true;
      document.getElementById('reset-btn').disabled = false;
      
      startAmbientDrone();
      runModule();
    }

    function runModule() {
      if (currentModuleIdx >= modules.length) {
        finish();
        return;
      }

      const mod = modules[currentModuleIdx];
      document.getElementById('step-title').textContent = mod.cat;
      document.getElementById('step-text').textContent = mod.text;
      document.getElementById('status-badge').textContent = "Escuchando...";
      document.getElementById('error-display').textContent = "";

      setAnimation(mod.animType);

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      const audioPath = `audio/${mod.file}`;
      currentAudio = new Audio(audioPath);

      currentAudio.onerror = () => {
        document.getElementById('status-badge').textContent = "Error de audio";
        document.getElementById('error-display').textContent = `No se encontró el archivo: ${audioPath}`;
      };

      currentAudio.play().catch(err => {
        console.error("Error al reproducir:", err);
        document.getElementById('error-display').textContent = "Toca la pantalla para permitir la reproducción de audio.";
      });

      currentAudio.onended = () => {
        if (mod.hasAmbientSounds) {
          playAmbientSequence();
        } else if (mod.pauseTime > 0) {
          let timeLeft = mod.pauseTime;
          document.getElementById('status-badge').textContent = `Realiza la acción (${timeLeft}s)`;
          
          const countdown = setInterval(() => {
            timeLeft--;
            if (timeLeft > 0) {
              document.getElementById('status-badge').textContent = `Realiza la acción (${timeLeft}s)`;
            } else {
              clearInterval(countdown);
              currentModuleIdx++;
              runModule();
            }
          }, 1000);
        } else {
          currentModuleIdx++;
          runModule();
        }
      };
    }

    function playAmbientSequence() {
      const sounds = [
        { type: 'bowl', text: "1. Cuenco tibetano (432 Hz)..." },
        { type: 'wind', text: "2. Viento místico..." },
        { type: 'whale', text: "3. Cantos de ballena..." }
      ];

      let soundIdx = 0;

      function triggerNextSound() {
        if (soundIdx >= sounds.length) {
          currentModuleIdx++;
          runModule();
          return;
        }

        const snd = sounds[soundIdx];
        document.getElementById('step-text').textContent = snd.text;
        document.getElementById('status-badge').textContent = "Escuchando sonido (8s)...";
        
        playSound(snd.type);

        actionTimeout = setTimeout(() => {
          soundIdx++;
          triggerNextSound();
        }, 8000); // 8 segundos exactos sin interrupción
      }

      triggerNextSound();
    }

    function finish() {
      stopAmbientDrone();
      setAnimation('pulse');
      document.getElementById('step-title').textContent = "Completado";
      document.getElementById('step-text').textContent = "Has vuelto al aquí y al ahora.";
      document.getElementById('status-badge').textContent = "✓ Finalizado";
      document.getElementById('start-btn').disabled = false;
      document.getElementById('reset-btn').disabled = true;
    }

    function reset() {
      clearTimeout(actionTimeout);
      stopAmbientDrone();
      
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      setAnimation('pulse');
      document.getElementById('step-title').textContent = "Preparación";
      document.getElementById('step-text').textContent = "Adopta una postura cómoda, respira profundo y presiona Iniciar.";
      document.getElementById('status-badge').textContent = "Listo";
      document.getElementById('error-display').textContent = "";
      document.getElementById('start-btn').disabled = false;
      document.getElementById('reset-btn').disabled = true;
    }
  </script>
</body>
</html>
