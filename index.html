<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio de Grounding 5-4-3-2-1</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1 id="stage-title">Cargando...</h1>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </header>

        <main class="stage-viewer">
            <div id="visual-content" class="visual-content"></div>
            <p id="stage-subtext" class="stage-subtext"></p>
        </main>

        <footer class="controls-container">
            <button id="btn-prev" class="btn">⏮ Anterior</button>
            <button id="btn-play-pause" class="btn btn-primary">▶ Iniciar</button>
            <button id="btn-next" class="btn">Siguiente ⏭</button>
        </footer>
    </div>

    <!-- Pista de música ambiental continua (Royalty Free CDN) -->
    <audio id="bg-music" src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=meditation-piano-112270.mp3" loop preload="auto"></audio>
    <audio id="main-audio" preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
