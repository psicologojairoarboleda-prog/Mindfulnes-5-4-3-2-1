<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Conexión Presente 5-4-3-2-1</title>
  <style>
    :root {
      --bg-dark: #080511;
      --card-bg: rgba(20, 13, 35, 0.88);
      --primary: #c094e8;
      --accent-glow: #e2c2ff;
      --text-light: #f1ecf9;
      --gold: #f3c677;
      --error: #ff5c5c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

    body {
      background: radial-gradient(circle at center, #180b2b 0%, var(--bg-dark) 100%);
      color: var(--text-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(192, 148, 232, 0.25);
      border-radius: 24px;
      padding: 35px 25px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 0 50px rgba(124, 92, 191, 0.3);
      text-align: center;
    }

    h1 {
      color: var(--primary);
      font-size: 1.5rem;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(192, 148, 232, 0.6);
    }

    .display-card {
      background: rgba(8, 5, 17, 0.75);
      border: 1px solid rgba(243, 198, 119, 0.2);
      border-radius: 20px;
      padding: 25px 20px;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
      position: relative;
    }

    .step-title {
      font-weight: 700;
      color: var(--gold);
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .step-text {
      font-size: 1.1rem;
      line-height: 1.5;
      margin-bottom: 12px;
      color: #e5dcfa;
    }

    .object-hint {
      font-size: 0.9rem;
      font-style: italic;
      color: var(--gold);
      background: rgba(243, 198, 119, 0.1);
      border-left: 3px solid var(--gold);
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      display: none;
    }

    .status-badge {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--accent-glow);
      background: rgba(192, 148, 232, 0.15);
      border: 1px solid rgba(192, 148, 232, 0.4);
      padding: 6px 16px;
      border-radius: 20px;
    }

    .error-msg { color: var(--error); font-weight: 600; margin-top: 10px; font-size: 0.85rem; }

    /* VIEWPORT Y ANIMACIONES */
    .anim-viewport {
      width: 140px;
      height: 140px;
      margin: 10px auto;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .anim-layer { display: none; width: 100%; height: 100%; position: absolute; }
    .active-anim { display: flex; justify-content: center; align-items: center; }

    .mystic-pulse {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(192,148,232,0.85) 0%, rgba(243,198,119,0.25) 70%, transparent 100%);
      animation: pulseGlow 3s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(0.85); opacity: 0.6; box-shadow: 0 0 15px var(--primary); }
      50% { transform: scale(1.15); opacity: 0.95; box-shadow: 0 0 30px var(--gold); }
    }

    .sound-waves {
      width: 90px; height: 90px;
      border: 2px solid var(--primary);
      border-radius: 50%;
      animation: waveExpand 2s infinite linear;
      position: absolute;
    }
    .sound-waves:nth-child(2) { animation-delay: 0.6s; }
    .sound-waves:nth-child(3) { animation-delay: 1.2s; }

    @keyframes waveExpand {
      0% { width: 20px; height: 20px; opacity: 1; border-color: var(--gold); }
      100% { width: 120px; height: 120px; opacity: 0; border-color: var(--primary); }
    }

    .olfato-svg { width: 120px; height: 120px; }
    .aroma-particle {
      fill: var(--gold);
      animation: flowAroma 3s infinite ease-in-out;
    }

    @keyframes flowAroma {
      0% { transform: translateY(25px) scale(0.3); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-45px) scale(1.3); opacity: 0; }
    }

    .breath-ring {
      fill: none;
      stroke: var(--primary);
      stroke-width: 2;
      animation: ringExpand 4s infinite ease-in-out;
      transform-origin: center;
    }

    @keyframes ringExpand {
      0%, 100% { transform: scale(0.8); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    /* BOTONES DE CONTROL COMPLETO */
    .controls { display: flex; flex-direction: column; gap: 12px; align-items: center; }
    
    .nav-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }

    button {
      background: linear-gradient(135deg, #7c5cbf 0%, #5a3d93 100%);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    button:disabled { background: #221a30; color: #554a6b; border-color: transparent; cursor: not-allowed; }
    
    .btn-main { width: 100%; padding: 14px; font-size: 1rem; }
    .btn-nav { flex: 1; background: rgba(192, 148, 232, 0.12); color: var(--text-light); }
    .btn-sec { background: rgba(255,255,255,0.06); color: #b3a9c9; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Conexión Presente</h1>

    <div class="display-card" id="card">
      <div id="step-title" class="step-title">Preparación</div>
      <div id="step-text" class="step-text">Adopta una postura cómoda, respira profundo y presiona Iniciar.</div>

      <div id="object-hint" class="object-hint"></div>

      <div class="anim-viewport">
        <div id="anim-pulse" class="anim-layer active-anim">
          <div class="mystic-pulse"></div>
        </div>

        <div id="anim-sound" class="anim-layer">
          <div class="sound-waves"></div>
          <div class="sound-waves"></div>
          <div class="sound-waves"></div>
        </div>

        <div id="anim-olfato" class="anim-layer">
          <svg class="olfato-svg" viewBox="0 0 100 100">
            <circle class="breath-ring" cx="50" cy="50" r="35" />
            <path d="M 50,85 C 35,65 35,45 50,25 C 65,45 65,65 50,85 Z" fill="none" stroke="rgba(243,198,119,0.4)" stroke-width="2"/>
            <circle class="aroma-particle" cx="50" cy="75" r="4.5" style="animation-delay: 0s;"/>
            <circle class="aroma-particle" cx="44" cy="65" r="3.5" style="animation-delay: 0.7s;"/>
            <circle class="aroma-particle" cx="56" cy="55" r="4" style="animation-delay: 1.4s;"/>
            <circle class="aroma-particle" cx="50" cy="40" r="3" style="animation-delay: 2.1s;"/>
          </svg>
        </div>
      </div>

      <div id="status-badge" class="status-badge">Listo</div>
      <div id="error-display" class="error-msg"></div>
    </div>

    <div class="controls">
      <!-- Fila 1: Control de Navegación del Ejercicio -->
      <div class="nav-group">
        <button id="prev-btn" class="btn-nav" onclick="navigateStep(-1)" disabled>◄ Anterior</button>
        <button id="pause-btn" class="btn-nav" onclick="togglePause()" disabled>❚❚ Pausa</button>
        <button id="next-btn" class="btn-nav" onclick="navigateStep(1)" disabled>Siguiente ►</button>
      </div>

      <!-- Fila 2: Inicio y Reinicio -->
      <button id="start-btn" class="btn-main" onclick="start()">Iniciar Experiencia</button>
      <button id="reset-btn" class="btn-sec" onclick="reset()" disabled>Reiniciar</button>
    </div>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    let bgMusicGain = null;
    let bgOscs = [];
    let bgFilter = null;

    // AMBIENTE AMBIENTAL MEDITATIVO (Pad continuo, extra suave, envolvente sin aristas)
    function startAmbientMusic() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (bgMusicGain) return;

      bgFilter = audioCtx.createBiquadFilter();
      bgFilter.type = 'lowpass';
      bgFilter.frequency.setValueAtTime(350, audioCtx.currentTime);

      bgMusicGain = audioCtx.createGain();
      bgMusicGain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      bgMusicGain.gain.linearRampToValueAtTime(0.035, audioCtx.currentTime + 3); // Entrada ultra suave

      bgFilter.connect(bgMusicGain);
      bgMusicGain.connect(audioCtx.destination);

      // Frecuencias Armónicas Meditativas (108 Hz base, 162 Hz quinta armónica, 216 Hz octava)
      const freqs = [108, 162, 216];
      bgOscs = freqs.map(freq => {
        const osc = audioCtx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        osc.connect(bgFilter);
        osc.start();
        return osc;
      });
    }

    function stopAmbientMusic() {
      if (bgMusicGain) {
        bgMusicGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
        setTimeout(() => {
          bgOscs.forEach(osc => { try { osc.stop(); osc.disconnect(); } catch(e){} });
          bgOscs = [];
          bgMusicGain = null;
        }, 1000);
      }
    }

    // SONIDOS GUÍA DE 8 SEGUNDOS EXACTOS
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (type === 'bowl') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(432, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 7.9);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 8.0);

      } else if (type === 'rain') {
        const bufferSize = audioCtx.sampleRate * 8;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.12;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, audioCtx.currentTime);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 1);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 7.9);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
        noise.stop(audioCtx.currentTime + 8.0);

      } else if (type === 'wind') {
        const bufferSize = audioCtx.sampleRate * 8;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * 0.15;

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(350, audioCtx.currentTime);
        filter.Q.value = 2.5;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(0.35, audioCtx.currentTime + 2);
        gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 7.9);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
        noise.stop(audioCtx.currentTime + 8.0);
      }
    }

    const modules = [
      { cat: "5. Vista", text: "Observa a tu alrededor y nombra 5 objetos mentalmente.", file: "audio_01_vista.mp3", pauseTime: 7, hint: "Ejemplo: Una lámpara, tu reloj, una planta, una ventana, una silla.", animType: "pulse" },
      { cat: "4. Tacto", text: "Conecta con la textura y temperatura de 4 objetos a tu alcance.", file: "audio_02_tacto.mp3", pauseTime: 10, hint: "Ejemplo: Tu ropa, la mesa de madera, la pantalla de tu celular, tus manos.", animType: "pulse" },
      { 
        cat: "3. Oído", 
        text: "Cierra los ojos y escucha atentamente.", 
        file: "audio_03_oido.mp3",
        hasAmbientSounds: true,
        hint: "Escucha los sonidos de tu entorno y las frecuencias guía.",
        animType: "sound"
      },
      { cat: "2. Olfato", text: "Huele 2 objetos y visualiza el recorrido del aroma.", file: "audio_04_olfato.mp3", pauseTime: 7, hint: "Ejemplo: Tu taza de café, una fruta, tu perfume o el ambiente.", animType: "olfato" },
      { cat: "1. Gusto", text: "Experimenta las sensaciones del alimento en tu boca.", file: "audio_05_sabor.mp3", pauseTime: 7, hint: "Ejemplo: Un sorbo de agua, una menta o el sabor presente en tu boca.", animType: "pulse" },
      { cat: "Cierre", text: "Mueve suavemente tus manos y tus hombros. Tu atención ha vuelto por completo al aquí y al ahora.", file: "audio_06_cierre.mp3", pauseTime: 0, hint: "", animType: "pulse" }
    ];

    let currentModuleIdx = 0;
    let currentAudio = null;
    let isPaused = false;
    let timerInterval = null;
    let actionTimeout = null;
    let remainingTime = 0;
    let isSoundSequence = false;

    function setAnimation(type) {
      document.getElementById('anim-pulse').classList.remove('active-anim');
      document.getElementById('anim-sound').classList.remove('active-anim');
      document.getElementById('anim-olfato').classList.remove('active-anim');

      if (type === 'sound') document.getElementById('anim-sound').classList.add('active-anim');
      else if (type === 'olfato') document.getElementById('anim-olfato').classList.add('active-anim');
      else document.getElementById('anim-pulse').classList.add('active-anim');
    }

    function updateNavButtons() {
      document.getElementById('prev-btn').disabled = (currentModuleIdx <= 0);
      document.getElementById('next-btn').disabled = (currentModuleIdx >= modules.length - 1);
      document.getElementById('pause-btn').disabled = false;
    }

    function start() {
      currentModuleIdx = 0;
      isPaused = false;
      document.getElementById('error-display').textContent = "";
      document.getElementById('start-btn').disabled = true;
      document.getElementById('reset-btn').disabled = false;
      
      startAmbientMusic();
      runModule();
    }

    function clearCurrentTimers() {
      if (timerInterval) clearInterval(timerInterval);
      if (actionTimeout) clearTimeout(actionTimeout);
    }

    function runModule() {
      clearCurrentTimers();
      isPaused = false;
      isSoundSequence = false;
      document.getElementById('pause-btn').textContent = "❚❚ Pausa";

      if (currentModuleIdx >= modules.length) {
        finish();
        return;
      }

      updateNavButtons();

      const mod = modules[currentModuleIdx];
      document.getElementById('step-title').textContent = mod.cat;
      document.getElementById('step-text').textContent = mod.text;
      document.getElementById('status-badge').textContent = "Escuchando...";
      document.getElementById('error-display').textContent = "";

      const hintEl = document.getElementById('object-hint');
      if (mod.hint) {
        hintEl.textContent = mod.hint;
        hintEl.style.display = "block";
      } else {
        hintEl.style.display = "none";
      }

      setAnimation(mod.animType);

      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }

      const audioPath = `audio/${mod.file}`;
      currentAudio = new Audio(audioPath);

      currentAudio.onerror = () => {
        document.getElementById('status-badge').textContent = "Error de audio";
        document.getElementById('error-display').textContent = `No se encontró el archivo: ${audioPath}`;
      };

      currentAudio.play().catch(err => {
        console.error("Error al reproducir:", err);
        document.getElementById('error-display').textContent = "Toca la pantalla para reproducir.";
      });

      currentAudio.onended = () => {
        if (mod.hasAmbientSounds) {
          playAmbientSequence();
        } else if (mod.pauseTime > 0) {
          startCountdown(mod.pauseTime);
        } else {
          currentModuleIdx++;
          runModule();
        }
      };
    }

    function startCountdown(seconds) {
      remainingTime = seconds;
      document.getElementById('status-badge').textContent = `Realiza la acción (${remainingTime}s)`;
      
      timerInterval = setInterval(() => {
        if (!isPaused) {
          remainingTime--;
          if (remainingTime > 0) {
            document.getElementById('status-badge').textContent = `Realiza la acción (${remainingTime}s)`;
          } else {
            clearInterval(timerInterval);
            currentModuleIdx++;
            runModule();
          }
        }
      }, 1000);
    }

    function playAmbientSequence() {
      isSoundSequence = true;
      const sounds = [
        { type: 'bowl', text: "1. Cuenco tibetano (432 Hz)..." },
        { type: 'rain', text: "2. Lluvia suave..." },
        { type: 'wind', text: "3. Viento místico..." }
      ];

      let soundIdx = 0;

      function triggerNextSound() {
        if (soundIdx >= sounds.length) {
          currentModuleIdx++;
          runModule();
          return;
        }

        const snd = sounds[soundIdx];
        document.getElementById('step-text').textContent = snd.text;
        document.getElementById('status-badge').textContent = "Escuchando sonido (8s)...";
        
        playSound(snd.type);

        actionTimeout = setTimeout(() => {
          if (!isPaused) {
            soundIdx++;
            triggerNextSound();
          }
        }, 8000);
      }

      triggerNextSound();
    }

    function togglePause() {
      isPaused = !isPaused;
      const pauseBtn = document.getElementById('pause-btn');

      if (isPaused) {
        pauseBtn.textContent = "▶ Reanudar";
        document.getElementById('status-badge').textContent = "⏸ Pausado";
        if (currentAudio && !currentAudio.paused) {
          currentAudio.pause();
        }
      } else {
        pauseBtn.textContent = "❚❚ Pausa";
        if (currentAudio && currentAudio.paused && currentAudio.currentTime > 0) {
          currentAudio.play();
          document.getElementById('status-badge').textContent = "Escuchando...";
        } else if (remainingTime > 0) {
          document.getElementById('status-badge').textContent = `Realiza la acción (${remainingTime}s)`;
        }
      }
    }

    function navigateStep(direction) {
      clearCurrentTimers();
      currentModuleIdx += direction;
      
      if (currentModuleIdx < 0) currentModuleIdx = 0;
      if (currentModuleIdx >= modules.length) currentModuleIdx = modules.length - 1;
      
      runModule();
    }

    function finish() {
      stopAmbientMusic();
      clearCurrentTimers();
      setAnimation('pulse');
      document.getElementById('object-hint').style.display = "none";
      document.getElementById('step-title').textContent = "Completado";
      document.getElementById('step-text').textContent = "Has vuelto al aquí y al ahora.";
      document.getElementById('status-badge').textContent = "✓ Finalizado";
      document.getElementById('start-btn').disabled = false;
      document.getElementById('reset-btn').disabled = true;
      document.getElementById('prev-btn').disabled = true;
      document.getElementById('next-btn').disabled = true;
      document.getElementById('pause-btn').disabled = true;
    }

    function reset() {
      clearCurrentTimers();
      stopAmbientMusic();
      
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      setAnimation('pulse');
      document.getElementById('object-hint').style.display = "none";
      document.getElementById('step-title').textContent = "Preparación";
      document.getElementById('step-text').textContent = "Adopta una postura cómoda, respira profundo y presiona Iniciar.";
      document.getElementById('status-badge').textContent = "Listo";
      document.getElementById('error-display').textContent = "";
      document.getElementById('start-btn').disabled = false;
      document.getElementById('reset-btn').disabled = true;
      document.getElementById('prev-btn').disabled = true;
      document.getElementById('next-btn').disabled = true;
      document.getElementById('pause-btn').disabled = true;
    }
  </script>
</body>
</html>
